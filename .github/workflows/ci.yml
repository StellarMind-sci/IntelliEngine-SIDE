name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify repository governance
        run: python scripts/verify_governance.py

  thoughtflow-contract:
    name: Thoughtflow (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify Thoughtflow machine contract
        run: python packages/thoughtflow/contracts/tools/verify_contract.py
      - name: Test Thoughtflow contract behavior
        run: python -m unittest packages/thoughtflow/tests/test_contract.py -v
      - name: Test Thoughtflow Python runtime
        run: python -m unittest packages/thoughtflow/tests/python/test_runtime.py -v
      - name: Test Thoughtflow TypeScript runtime
        run: node --test packages/thoughtflow/tests/ts/runtime.test.ts
      - name: Compare Thoughtflow consumers
        run: python packages/thoughtflow/scripts/differential.py
      - name: Regress CognitiveNode Python consumers
        run: python -m unittest packages/cognitive-ir/tests/test_cognitive_node_contract.py packages/cognitive-ir/tests/cognitive_node_python/test_runtime.py packages/cognitive-ir/tests/conformance_python/test_consumer.py tests/cognitive-node/test_differential.py tests/conformance/test_differential.py
      - name: Regress CognitiveNode TypeScript consumers
        run: node --test packages/cognitive-ir/tests/cognitive-node-ts/*.test.ts packages/cognitive-ir/tests/conformance-ts/*.test.ts
      - name: Regress KnowledgeUnit Python consumers
        run: python -m unittest packages/knowledge-units/tests/test_contract.py packages/knowledge-units/tests/python/test_runtime.py packages/knowledge-units/tests/test_differential.py
      - name: Regress KnowledgeUnit TypeScript consumers
        run: node --test packages/knowledge-units/tests/ts/*.test.ts


  # Add lint, unit, contract, integration, security, package-compatibility, and build jobs as
  # implementation enters the repository. Keep each job independently reviewable and required.

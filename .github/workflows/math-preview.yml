name: Math preview

on:
  pull_request:
    paths:
      - "plugins/math/**"
      - ".github/workflows/math-preview.yml"
      - "docs/demos/linear-equation-model-preview-acceptance.md"
      - "docs/demos/artifacts/linear-equation-model-preview/**"
  push:
    branches: [main]
    paths:
      - "plugins/math/**"
      - ".github/workflows/math-preview.yml"
      - "docs/demos/linear-equation-model-preview-acceptance.md"
      - "docs/demos/artifacts/linear-equation-model-preview/**"

permissions:
  contents: read

jobs:
  test:
    name: Math preview (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test linear equation model preview
        run: node --test plugins/math/linear-equation-preview/tests/*.test.ts

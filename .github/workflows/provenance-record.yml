name: Provenance record contract

on:
  pull_request:
    paths:
      - ".github/workflows/provenance-record.yml"
      - "services/provenance/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/provenance-record.yml"
      - "services/provenance/**"

permissions:
  contents: read

jobs:
  provenance-record:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PIP_NO_INDEX: "1"
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify provenance-record contract
        run: python -B services/provenance/tests/test_provenance_record_contract.py
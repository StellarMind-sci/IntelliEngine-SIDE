name: 高风险任务卡
description: 仅用于权限、写入、凭据、外部系统、不可逆操作、生产发布或安全隔离。
title: "[高风险] "
labels: ["high-risk"]
body:
  - type: textarea
    id: product
    attributes:
      label: 用户/产品问题与预期结果
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 范围、非目标与允许修改范围
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: 风险提示
      description: 安全影响、权限边界、兼容性/迁移、数据影响和回滚。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收、审核测试与人工审查条件
      description: |-
        写清用户能力、验收入口、前置条件、操作步骤、预期结果、异常场景、证据、测试命令、已知限制与回滚。
        无界面任务提供命令及输入/输出示例；界面任务覆盖正常、阻断/错误、空状态并提供截图或录屏（或替代验证方式）。
    validations:
      required: true

name: 产品任务卡
description: 规划一个可实现、可测试、可演示的产品结果。
title: "[产品] "
labels: ["task"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 用户/产品问题
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 预期产品结果
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 范围与允许修改范围
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: 非目标
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收条件与测试命令
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: 风险和回滚
    validations:
      required: true

name: Codex 任务契约
description: 为一个 Codex 任务和一个 PR 创建边界清晰、可审查、可测试的 Issue。
title: "[模块] "
labels: ["codex-task"]
body:
  - type: textarea
    id: context
    attributes:
      label: 背景与问题
      description: 说明当前情况，以及需要解决的问题。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 一句话结果与交付物
      description: 写明一个可审查结果，并列出具体产物。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 范围、非目标与允许修改的路径
      description: 写明主要模块、允许目录和明确排除项。
    validations:
      required: true
  - type: textarea
    id: interfaces
    attributes:
      label: 输入、输出与公共接口影响
      description: 指出唯一被修改的公共契约；若无，请填写“无”。
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: 依赖与权威上下文
      description: 链接前置 Issue、已接受 ADR/RFC、契约和当前失败信息。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收条件
      description: 使用可观察、可测试的结果。
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: 必须验证的内容
      description: 列出准确的治理、模块、契约、集成、安全和构建检查。
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: 风险与回滚
      description: 写明失败模式、feature flags、兼容需求和回滚步骤。
    validations:
      required: true
